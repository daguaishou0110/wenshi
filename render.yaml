services:
  - type: web
    name: canopy-disease
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/config
    envVars:
      - key: YOLO_CONF
        value: "0.25"
      - key: EXPLAIN_CONF_THRESHOLD
        value: "0.55"
      - key: OPENCLAW_BASE_URL
        value: "https://openclaw-api.com/v1"
      - key: OPENCLAW_MODEL
        value: "gpt-5.4-mini"
      - key: OPENCLAW_API_KEY
        sync: false
