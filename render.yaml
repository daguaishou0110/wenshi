services:
  - type: web
    name: wenshi
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python entrypoint.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: YOLO_CONF
        value: "0.25"
      - key: EXPLAIN_CONF_THRESHOLD
        value: "0.55"
      - key: OPENCLAW_BASE_URL
        value: "https://openclaw-api.com/v1"
      - key: OPENCLAW_MODEL
        value: "gpt-5.4-mini"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ORT_INTRA_THREADS
        value: "1"
      - key: ORT_INTER_THREADS
        value: "1"
      - key: OPENCLAW_API_KEY
        sync: false
